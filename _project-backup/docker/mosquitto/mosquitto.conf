# ================================================================
# Mosquitto MQTT Broker — Production Configuration
# ================================================================

# ===================== LISTENERS =====================

# TCP listener (untuk IoT devices di jaringan)
listener 1883
protocol mqtt

# WebSocket listener (untuk browser/dashboard)
listener 9001
protocol websockets

# ===================== AUTHENTICATION =====================

# Wajib gunakan username/password
allow_anonymous false
password_file /mosquitto/config/passwd

# ===================== LOGGING =====================

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ===================== PERSISTENCE =====================

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# ===================== SECURITY =====================

# Maksimum koneksi
max_connections 100

# QoS message max inflight
max_inflight_messages 20

# ===================== CONNECTION SETTINGS =====================

# Maksimum ukuran paket
message_size_limit 256000
