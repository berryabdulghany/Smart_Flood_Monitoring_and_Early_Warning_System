server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php index.html;

    # ===================== CHARSET =====================
    charset utf-8;

    # ===================== LOGS =====================
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ===================== SECURITY HEADERS =====================
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # ===================== GZIP COMPRESSION =====================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ===================== STATIC ASSETS =====================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ===================== MAIN ROUTER =====================
    # ================= PROXY API (satu asal) =================
    # Sebelumnya browser memanggil FastAPI dan AI Engine langsung ke porta 8000 dan
    # 5000. Akibatnya porta itu harus dibuka ke publik, dan begitu situs memakai
    # HTTPS seluruh panggilannya akan diblokir sebagai mixed content.
    #
    # Blok di bawah menyediakan jalur satu asal. Bersifat TAMBAHAN: pemanggilan lama
    # lewat porta langsung tetap berfungsi, sehingga dapat dipindahkan bertahap.
    #
    # Untuk memakainya, isi berkas .env:
    #     FASTAPI_PUBLIC_URL=/api
    #     AI_ENGINE_PUBLIC_URL=/ai
    # Keduanya sudah dibaca config/sfmews.php, jadi tidak perlu ubah kode.

    location /api/ {
        proxy_pass         http://fastapi-backend:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /ai/ {
        proxy_pass         http://ai-engine:5000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Deteksi dari siaran CCTV dapat memakan waktu: batas buka dan baca aliran
        # masing-masing 8 detik, ditambah inferensi model.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ===================== PHP-FPM =====================
    location ~ \.php$ {
        fastcgi_pass laravel:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Timeout settings
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        # Buffer settings
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ===================== DENY ACCESS =====================
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ===================== CLIENT MAX BODY =====================
    client_max_body_size 50M;
}
